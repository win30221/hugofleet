apiVersion: v1
kind: Namespace
metadata:
  name: hf-demo
  labels:
    app.kubernetes.io/part-of: hugofleet
    hugofleet.io/managed-by: m0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api
  namespace: hf-demo
  labels:
    app.kubernetes.io/name: pricing-api
    app.kubernetes.io/part-of: hugofleet
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing-api
        app.kubernetes.io/part-of: hugofleet
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing-api
          image: pricing-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-api
  namespace: hf-demo
  labels:
    app.kubernetes.io/part-of: hugofleet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pricing-api
  ports:
    - name: http
      port: 8080
      targetPort: http
