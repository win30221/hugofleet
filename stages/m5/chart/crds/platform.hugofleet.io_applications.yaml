---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: applications.platform.hugofleet.io
spec:
  group: platform.hugofleet.io
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    shortNames:
    - hfapp
    singular: application
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.revision
      name: Revision
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              image:
                description: 'Supported policy: lowercase Docker repository, optional
                  registry port, tag and/or sha256 digest.'
                maxLength: 512
                minLength: 1
                pattern: ^([a-z0-9]+([.-][a-z0-9]+)*(:[0-9]{1,5})?/)?[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?(@sha256:[a-f0-9]{64})?$
                type: string
              livenessPath:
                default: /healthz
                maxLength: 256
                pattern: ^/[A-Za-z0-9._~/-]*$
                type: string
                x-kubernetes-validations:
                - message: probe must be a local absolute path
                  rule: '!self.startsWith(''//'')'
              port:
                default: 8080
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              readinessPath:
                default: /readyz
                maxLength: 256
                pattern: ^/[A-Za-z0-9._~/-]*$
                type: string
                x-kubernetes-validations:
                - message: probe must be a local absolute path
                  rule: '!self.startsWith(''//'')'
              replicas:
                default: 1
                format: int32
                maximum: 3
                minimum: 1
                type: integer
              resources:
                properties:
                  limits:
                    description: ResourceValues deliberately uses strings so schema
                      and Go share quantity validation.
                    properties:
                      cpu:
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: cpu must be a positive Kubernetes quantity
                          rule: 'isQuantity(self) ? quantity(self).isGreaterThan(quantity(''0''))
                            : false'
                      memory:
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: memory must be a positive Kubernetes quantity
                          rule: 'isQuantity(self) ? quantity(self).isGreaterThan(quantity(''0''))
                            : false'
                    required:
                    - cpu
                    - memory
                    type: object
                  requests:
                    description: ResourceValues deliberately uses strings so schema
                      and Go share quantity validation.
                    properties:
                      cpu:
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: cpu must be a positive Kubernetes quantity
                          rule: 'isQuantity(self) ? quantity(self).isGreaterThan(quantity(''0''))
                            : false'
                      memory:
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: memory must be a positive Kubernetes quantity
                          rule: 'isQuantity(self) ? quantity(self).isGreaterThan(quantity(''0''))
                            : false'
                    required:
                    - cpu
                    - memory
                    type: object
                required:
                - limits
                - requests
                type: object
                x-kubernetes-validations:
                - message: cpu limit must be at least the request
                  rule: 'isQuantity(self.requests.cpu) && isQuantity(self.limits.cpu)
                    ? quantity(self.limits.cpu).compareTo(quantity(self.requests.cpu))
                    >= 0 : false'
                - message: memory limit must be at least the request
                  rule: 'isQuantity(self.requests.memory) && isQuantity(self.limits.memory)
                    ? quantity(self.limits.memory).compareTo(quantity(self.requests.memory))
                    >= 0 : false'
              revision:
                format: int64
                minimum: 1
                type: integer
            required:
            - image
            - resources
            - revision
            type: object
          status:
            properties:
              availableReplicas:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              image:
                type: string
              observedGeneration:
                format: int64
                type: integer
              observedRevision:
                format: int64
                type: integer
              readyReplicas:
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: application name must be a DNS label of at most 63 characters
          rule: size(self.metadata.name) <= 63 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
