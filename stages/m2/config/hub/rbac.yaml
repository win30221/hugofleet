apiVersion: v1
kind: ServiceAccount
metadata:
  name: hugofleet-hub
  namespace: hf-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hugofleet-hub
  namespace: hf-demo
rules:
  - apiGroups: [platform.hugofleet.io]
    resources: [applications]
    verbs: [get, list, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [services, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hugofleet-hub
  namespace: hf-demo
subjects:
  - kind: ServiceAccount
    name: hugofleet-hub
    namespace: hf-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hugofleet-hub
