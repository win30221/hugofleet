---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hugofleet-operator
  namespace: hf-demo
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.hugofleet.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.hugofleet.io
  resources:
  - applications/finalizers
  verbs:
  - update
- apiGroups:
  - platform.hugofleet.io
  resources:
  - applications/status
  verbs:
  - get
  - patch
  - update
