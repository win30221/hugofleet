apiVersion: platform.hugofleet.io/v1alpha1
kind: Application
metadata:
  name: pricing-api
  namespace: hf-demo
spec:
  revision: 1
  image: pricing-api:v1
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi
  readinessPath: /readyz
  livenessPath: /healthz
