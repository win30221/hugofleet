apiVersion: v1
kind: ServiceAccount
metadata:
  name: hugofleet-agent
  namespace: hf-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hugofleet-agent-ledger
  namespace: hf-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hugofleet-agent
  namespace: hf-demo
rules:
  - apiGroups: [platform.hugofleet.io]
    resources: [applications]
    verbs: [get, list, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services, pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [hugofleet-agent-ledger]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hugofleet-agent
  namespace: hf-demo
subjects:
  - kind: ServiceAccount
    name: hugofleet-agent
    namespace: hf-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hugofleet-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugofleet-agent
  namespace: hf-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hugofleet-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hugofleet-agent
    spec:
      serviceAccountName: hugofleet-agent
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: hugofleet-agent:m3
          imagePullPolicy: IfNotPresent
          args:
            - --hub=HUB_ENDPOINT
            - --cluster=CLUSTER_ID
            - --certs=/certs
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: hugofleet-agent-tls
            defaultMode: 0444
